<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#2a69be">

    <title th:text="${titulo} + ' • Agenda Fácil'">Novo contato • Agenda Fácil</title>

    <!-- Bootstrap: biblioteca CSS para criar páginas responsivas. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Nossos estilos (src/main/resources/static/css/agenda.css). -->
    <link rel="stylesheet" th:href="@{/css/agenda.css}" href="/css/agenda.css">
</head>

<body>

    <!-- Ícones SVG reaproveitados na página. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-livro" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"/></symbol>
        <symbol id="i-voltar" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    </svg>

    <!-- Barra superior do sistema. -->
    <header class="topo">
        <div class="container">

            <a class="marca" th:href="@{/contatos}" href="/contatos">
                <span class="marca-icone">
                    <svg class="icone" aria-hidden="true"><use href="#i-livro"/></svg>
                </span>
                Agenda Fácil
            </a>

            <a th:href="@{/contatos}" href="/contatos" class="btn btn-suave btn-sm">
                <svg class="icone" aria-hidden="true"><use href="#i-voltar"/></svg>
                Voltar
            </a>

        </div>
    </header>

    <main class="container pagina">

        <div class="form-pagina">

            <div class="cabecalho">
                <div>
                    <h1 class="titulo" th:text="${titulo}">Novo contato</h1>
                    <p class="subtitulo">Preencha as informações do contato.</p>
                </div>
            </div>

            <div class="painel form-cartao">

                <!-- Formulário que envia os dados pelo método POST. -->
                <form th:action="@{/contatos/salvar}" action="#"
                      th:object="${contato}"
                      method="post"
                      id="formContato">

                    <!-- Guarda o ID durante a edição. -->
                    <input type="hidden" th:field="*{id}">

                    <div class="campo">
                        <div class="form-floating">
                            <input type="text"
                                   th:field="*{nome}"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                   class="form-control"
                                   placeholder="Digite o nome"
                                   maxlength="100"
                                   autocomplete="name"
                                   autofocus
                                   required>
                            <label for="nome">Nome completo</label>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('nome')}"
                                 th:errors="*{nome}">
                            </div>
                        </div>
                    </div>

                    <div class="campo">
                        <div class="form-floating">
                            <input type="tel"
                                   inputmode="tel"
                                   th:field="*{telefone}"
                                   th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                                   class="form-control"
                                   placeholder="(11) 99999-9999"
                                   maxlength="20"
                                   autocomplete="tel"
                                   required>
                            <label for="telefone">Telefone</label>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('telefone')}"
                                 th:errors="*{telefone}">
                            </div>
                        </div>
                    </div>

                    <div class="campo">
                        <div class="form-floating">
                            <input type="email"
                                   inputmode="email"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   class="form-control"
                                   placeholder="email@exemplo.com"
                                   maxlength="100"
                                   autocomplete="email"
                                   required>
                            <label for="email">E-mail</label>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>
                        </div>
                    </div>

                    <p class="dica">Todos os campos são obrigatórios.</p>

                    <div class="form-botoes">

                        <button type="submit" class="btn btn-primary" id="btnSalvar">
                            <svg class="icone" aria-hidden="true"><use href="#i-check"/></svg>
                            Salvar contato
                        </button>

                        <a th:href="@{/contatos}" href="/contatos" class="btn btn-suave">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

    <script>
        // --- Máscara de telefone: (11) 99999-9999 ou (11) 9999-9999. ---
        const telefone = document.getElementById('telefone');

        function formatarTelefone() {
            const d = telefone.value.replace(/\D/g, '').slice(0, 11);
            let v = d;
            if (d.length > 10)     v = `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
            else if (d.length > 6) v = `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
            else if (d.length > 2) v = `(${d.slice(0, 2)}) ${d.slice(2)}`;
            else if (d.length > 0) v = `(${d}`;
            telefone.value = v;
        }

        telefone.addEventListener('input', formatarTelefone);
        if (telefone.value) formatarTelefone(); // ao editar, formata o valor já salvo

        // --- Evita enviar duas vezes se a pessoa clicar rápido em "Salvar". ---
        document.getElementById('formContato').addEventListener('submit', () => {
            const botao = document.getElementById('btnSalvar');
            setTimeout(() => { botao.disabled = true; }, 0);
        });
    </script>

</body>
</html>
